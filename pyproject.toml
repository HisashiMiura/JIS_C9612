[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jis-c9612"
version = "0.1.0"
description = "JIS C 9612:2013 附属書 B による回転数制御形ルームエアコンの APF 計算"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jis-c9612 = "jis_c9612.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
