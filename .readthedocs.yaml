# Read the Docs の設定 (https://docs.readthedocs.io/en/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# docs/ の Sphinx でビルドする。警告が出たらビルドを失敗にする (手元のビルドも警告なしを保っている)
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# ドキュメントのビルドに必要なものだけを入れる。図 (docs/figures/*.svg) はリポジトリに含めているので matplotlib は不要
python:
  install:
    - requirements: docs/requirements.txt
